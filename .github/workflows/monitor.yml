name: Monitor de disponibilidade do bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que duas execucoes rodem ao mesmo tempo -- sem isso, uma execucao
# agendada que dispara enquanto outra (manual ou agendada) ainda esta
# salvando o log gera conflito de merge em disponibilidade_log.csv e a
# execucao falha inteira, mesmo a checagem em si tendo funcionado.
# cancel-in-progress: false para nao perder checagens -- elas esperam na
# fila em vez de serem canceladas.
concurrency:
  group: monitor-log
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar checagem
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: python monitor_disponibilidade.py

      - name: Salvar log atualizado no repositorio
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add disponibilidade_log.csv
          git diff --staged --quiet || git commit -m "Registro de disponibilidade $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # retry simples -- o GitHub ocasionalmente da erro 500/interno nesse endpoint;
          # como rodamos a cada 15min por 30 dias, vale a pena tentar de novo em vez de
          # perder o registro por uma falha pontual e rara do lado deles.
          for tentativa in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push falhou (tentativa $tentativa), tentando de novo em 10s..."
            sleep 10
            git pull --rebase
          done
